name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Cancel any in-progress run on the same branch when a new one starts
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # Windows — NSIS installer + MSI
  # ─────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@1.90.0

      # sherpa-onnx and other heavy native crates make the first build slow (~30-60 min).
      # This cache cuts subsequent runs dramatically.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # ── Windows code signing (add when you have a cert) ─────────────────
      # Add these as repository secrets, then uncomment the env block below:
      #   WINDOWS_CERTIFICATE    — base64-encoded .pfx file
      #   WINDOWS_CERTIFICATE_PASSWORD — pfx password
      # Also update tauri.conf.json bundle.windows.certificateThumbprint.
      # See: https://v2.tauri.app/distribute/sign/windows/
      # ────────────────────────────────────────────────────────────────────
      - name: Build
        run: npm run package:windows
        # env:
        #   WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        #   WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: vocyl-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # Linux x86_64 — AppImage + deb + rpm
  # ─────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri system deps + libasound2 (cpal) + libclang (whisper-rs bindgen) + cmake (sherpa-onnx)
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libclang-dev \
            cmake \
            libxdo-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@1.90.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build
        run: npm run package:linux

      - uses: actions/upload-artifact@v4
        with:
          name: vocyl-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # macOS — ARM64 (native) + Intel (cross-compile)
  # Both run sequentially in one job to save macOS runner minutes (10× multiplier).
  # ─────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    # Job-level env so MACOSX_DEPLOYMENT_TARGET is set before cmake ever runs.
    # The cmake crate (used by whisper-rs-sys) skips reconfiguration when
    # CMakeCache.txt already exists, so it must be set correctly on the FIRST
    # cmake invocation — a step-level env is too late if a cached CMakeCache.txt
    # was written without it. The intel build step overrides this to "10.15".
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # v2: bust caches from earlier runs that stored a CMakeCache.txt
          # configured without the correct MACOSX_DEPLOYMENT_TARGET.
          key: v2

      - run: npm ci

      # ── macOS code signing + notarization (add when you have an Apple Developer account) ──
      # Add these as repository secrets, then uncomment the env blocks below:
      #   APPLE_CERTIFICATE          — base64-encoded .p12 (Developer ID Application cert)
      #   APPLE_CERTIFICATE_PASSWORD — p12 password
      #   APPLE_SIGNING_IDENTITY     — "Developer ID Application: Your Name (TEAMID)"
      #   APPLE_ID                   — your Apple ID email
      #   APPLE_PASSWORD             — app-specific password (not your Apple ID password)
      #   APPLE_TEAM_ID              — your 10-character Team ID
      # See: https://v2.tauri.app/distribute/sign/macos/
      # Without signing, testers must right-click → Open, or run:
      #   xattr -d com.apple.quarantine /path/to/Vocyl.app
      # ────────────────────────────────────────────────────────────────────────────────────

      - name: Build macOS ARM64
        run: npm run package:mac
        env:
          # Inherits MACOSX_DEPLOYMENT_TARGET=11.0 from job level.
          # ── Uncomment when you have an Apple Developer account ──────────
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build macOS Intel
        run: npm run package:mac:intel
        env:
          # 10.15 is the minimum macOS with std::filesystem; overrides the job-level 11.0.
          # Intel target uses a separate target dir so its CMakeCache.txt is independent.
          MACOSX_DEPLOYMENT_TARGET: "10.15"
          # ── Uncomment when you have an Apple Developer account ──────────
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: vocyl-macos-arm64
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: vocyl-macos-intel
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

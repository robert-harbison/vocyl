[package]
name = "vocyl"
version = "0.1.0"
description = "Vocyl cross-platform TTS/STT app."
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vocyl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Audio device enumeration and recording
cpal = "0.15"

# Audio playback
rodio = { version = "0.20", features = ["wav"] }

# HTTP downloads with streaming progress
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"

# Async file I/O and process execution
tokio = { version = "1", features = ["fs", "process", "time", "sync", "macros", "rt"] }

# Text injection at cursor
enigo = "0.3"

# WAV file writing for STT recordings on Windows (subprocess path)
hound = "3.5"

# ZIP archive extraction for binary downloads
zip = "2"

# tar.bz2 and tar.gz extraction for model/binary packages
bzip2 = "0.4"
tar = "0.4"
flate2 = "1"

# Clipboard read/write for TTS selected-text capture
arboard = "3"

# Kokoro TTS — native ONNX inference, model stays loaded between calls
sherpa-onnx = "1"

# Whisper STT — native inference on Linux/macOS.
# On Windows, whisper-rs requires LLVM/clang for bindgen; the subprocess
# (whisper-cli.exe) is used instead so no extra toolchain setup is needed.
[target.'cfg(not(target_os = "windows"))'.dependencies]
whisper-rs = "0.16"

# Faster incremental builds in dev, small binary in release
[profile.dev]
incremental = true
debug = "line-tables-only"   # enough for backtraces, faster than full debug

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"


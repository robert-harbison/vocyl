name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Cancel any in-progress run on the same branch when a new one starts
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # Windows - NSIS installer + MSI
  # ─────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@1.90.0

      # sherpa-onnx and other heavy native crates make the first build slow (~30-60 min).
      # This cache cuts subsequent runs dramatically.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # ── Windows code signing (add when you have a cert) ─────────────────
      # Add these as repository secrets, then uncomment the env block below:
      #   WINDOWS_CERTIFICATE    - base64-encoded .pfx file
      #   WINDOWS_CERTIFICATE_PASSWORD - pfx password
      # Also update tauri.conf.json bundle.windows.certificateThumbprint.
      # See: https://v2.tauri.app/distribute/sign/windows/
      # ────────────────────────────────────────────────────────────────────
      - name: Build
        run: npm run package:windows
        # env:
        #   WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        #   WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: vocyl-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # Linux x86_64 - AppImage + deb + rpm
  # ─────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri system deps + libasound2 (cpal) + libclang (whisper-rs bindgen) + cmake (sherpa-onnx)
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libclang-dev \
            cmake \
            libxdo-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@1.90.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build
        run: npm run package:linux

      - uses: actions/upload-artifact@v4
        with:
          name: vocyl-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # macOS - ARM64 (native) + Intel (cross-compile)
  # Both run sequentially in one job to save macOS runner minutes (10× multiplier).
  # ─────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: x86_64-apple-darwin

      # macOS runners (macOS 15+) ship with a Homebrew `rustup` formula that
      # puts a `cargo` shim (actually `rustup-init`) in Homebrew's bin, which
      # can shadow the real cargo installed by dtolnay/rust-toolchain.
      # Prepending ~/.cargo/bin ensures the correct cargo is found first.
      - name: Ensure cargo is on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # v3: bust caches built when tauri was defaulting MACOSX_DEPLOYMENT_TARGET
          # to 10.13 (cmake configured ggml without std::filesystem support).
          # Root fix is tauri.conf.json bundle.macOS.minimumSystemVersion = "10.15".
          key: v3

      - run: npm ci

      # ── macOS code signing + notarization (add when you have an Apple Developer account) ──
      # Add these as repository secrets, then add an env: block to each build step below:
      #   APPLE_CERTIFICATE          - base64-encoded .p12 (Developer ID Application cert)
      #   APPLE_CERTIFICATE_PASSWORD - p12 password
      #   APPLE_SIGNING_IDENTITY     - "Developer ID Application: Your Name (TEAMID)"
      #   APPLE_ID                   - your Apple ID email
      #   APPLE_PASSWORD             - app-specific password (not your Apple ID password)
      #   APPLE_TEAM_ID              - your 10-character Team ID
      # See: https://v2.tauri.app/distribute/sign/macos/
      # Without signing, testers must right-click → Open, or run:
      #   xattr -d com.apple.quarantine /path/to/Vocyl.app
      # ────────────────────────────────────────────────────────────────────────────────────

      # Build with --bundles app only: Tauri's bundle_dmg.sh uses hdiutil which is
      # unreliable on GitHub runners. We zip the .app ourselves with ditto instead.
      # The package:mac scripts (dmg,app) are kept for local use unchanged.
      - name: Build macOS ARM64
        run: npx tauri build --bundles app

      - name: Build macOS Intel
        run: npx tauri build --target x86_64-apple-darwin --bundles app

      - name: Zip macOS ARM64
        run: ditto -c -k --keepParent src-tauri/target/release/bundle/macos/vocyl.app vocyl-macos-arm64.zip

      - name: Zip macOS Intel
        run: ditto -c -k --keepParent src-tauri/target/x86_64-apple-darwin/release/bundle/macos/vocyl.app vocyl-macos-intel.zip

      - uses: actions/upload-artifact@v4
        with:
          name: vocyl-macos-arm64
          path: vocyl-macos-arm64.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: vocyl-macos-intel
          path: vocyl-macos-intel.zip
          if-no-files-found: error

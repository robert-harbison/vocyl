[package]
name = "vocyl"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vocyl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Audio device enumeration and recording
cpal = "0.15"

# Audio playback
rodio = { version = "0.20", features = ["wav"] }

# HTTP downloads with streaming progress
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"

# Async file I/O and process execution
tokio = { version = "1", features = ["fs", "process", "time"] }

# Text injection at cursor
enigo = "0.3"

# WAV file writing for STT recordings
hound = "3.5"

# ZIP archive extraction for binary downloads
zip = "2"

# tar.bz2 extraction for sherpa-onnx / Kokoro model packages
bzip2 = "0.4"
tar = "0.4"

# Clipboard read/write for TTS selected-text capture
arboard = "3"

# Faster incremental builds in dev, small binary in release
[profile.dev]
incremental = true
debug = "line-tables-only"   # enough for backtraces, faster than full debug

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"

